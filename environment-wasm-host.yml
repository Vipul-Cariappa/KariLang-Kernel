name: xeus-karilang-wasm-host
channels:
  # emscripten-forge moved to prefix.dev; -4x is the channel built against the
  # emscripten 4.x ABI, which is what xeus 6 and xeus-lite 5 are packaged for.
  - https://prefix.dev/emscripten-forge-4x
  - conda-forge
dependencies:
  - nlohmann_json
  - xeus-lite >=5.0,<6.0
  - xeus >=6.0,<7.0
